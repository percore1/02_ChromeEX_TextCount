<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>TextCount</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="header">
    <span class="header-title">TextCount</span>
    <span id="sync-badge" class="sync-badge sync-waiting">待機中</span>
  </div>

  <div class="tabs">
    <button class="tab active" data-target="tab-auto">自動</button>
    <button class="tab" data-target="tab-paste">貼り付け</button>
    <button class="tab" data-target="tab-file">ファイル</button>
  </div>

  <div id="tab-auto" class="tab-content active">
    <div class="tab-description">ページでテキストを選択すると自動的にカウントされます。</div>
  </div>

  <div id="tab-paste" class="tab-content">
    <div class="tab-description">下のエリアにテキストを貼り付けてください。</div>
    <textarea id="paste-area" placeholder="ここにテキストを貼り付け..."></textarea>
    <button id="paste-clear" class="secondary-btn">クリア</button>
  </div>

  <div id="tab-file" class="tab-content">
    <div class="tab-description">.txt / .docx ファイルをドロップまたは選択してください。</div>
    <label id="file-drop" class="file-drop">
      <input type="file" id="file-input" accept=".txt,.docx" hidden>
      <div class="file-drop-inner">
        <div class="file-drop-icon">📄</div>
        <div class="file-drop-text">クリックまたはドラッグ＆ドロップ</div>
        <div class="file-drop-sub">.txt / .docx 対応</div>
      </div>
    </label>
    <div id="file-info" class="file-info" style="display:none"></div>
  </div>

  <div id="status" class="status">テキストを選択・貼り付け・アップロードしてください</div>

  <div id="results" style="display:none">

    <div class="count-main">
      <div class="count-label">カウント対象文字数</div>
      <div class="count-value">
        <span id="counted-length">0</span>
        <span class="count-unit">文字</span>
      </div>
    </div>

    <div class="count-detail">
      <div class="detail-row">
        <span class="detail-label">元文字数</span>
        <span class="detail-value"><span id="original-count">0</span> 文字</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">除外文字数</span>
        <span class="detail-value"><span id="excluded-count">0</span> 文字</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">適用した除外ルール</div>
      <ul id="applied-rules"></ul>
    </div>

    <div id="warnings-section" class="section warning-section" style="display:none">
      <div class="section-title">⚠ 要確認項目</div>
      <ul id="warnings-list"></ul>
    </div>

    <div class="section section-last">
      <div class="section-header">
        <span class="section-title">除外後テキストプレビュー</span>
        <button id="copy-btn" class="copy-btn">📋 コピー</button>
      </div>
      <div id="preview" class="preview"></div>
    </div>

  </div>

  <script src="mammoth.browser.min.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
